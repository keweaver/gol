<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="style.css">
        <meta charset="UTF-8">
    </head>
    <body>
        <div class="container">
            <canvas id="canvas" width="800" height="800" style="border:1px solid black;">display</canvas>
        </div>
        <p id="text">test</p>

        
    </body>
    <script>
        const CELL_WIDTH = 10; 
    
        class Cell {
            /*
            Instance of one cell 
            */
            constructor(i, j, cw, alive, ctx) {
                this.i = i; //x coordinate
                this.j = j; //y coordinate
                this.cw = cw; //cell width
                this.alive = alive; //past status, t/f
                this.alive_next = alive; //future status, t/f
                this.ctx = ctx; //context to draw on 
                this.cell_width = CELL_WIDTH; //width for pixels
            }

            draw() {
                if (this.alive_next) { //if alive in current frame, render color
                    this.ctx.fillStyle = 'white';
                    this.ctx.fillRect(this.i, this.j, this.cw, this.cw);
                }
                else { //if dead, render other color 
                    this.ctx.fillStyle = 'black';
                    this.ctx.fillRect(this.i, this.j, this.cw, this.cw);
                }
            }
        }
    
        class Board {
            /*
            Instance of game board, contains w/h and cells 
            */
            constructor(id) {
                this.canvas = document.getElementById(id); //canvas to draw on
                this.cell_width = CELL_WIDTH; //width of cell 
                this.width = this.canvas.width / this.cell_width; //num cells x direction
                this.height = this.canvas.height / this.cell_width; //num cells y direction
                
                //number of warps = rand (1 to width / cell_width / 2 ) 
                this.num_cols = Math.floor(Math.random() * ((this.width / 2) - 1) + 1);
                //this.warp is the width of each cell to be rendered 
                this.warp = this.gen_warp(); 
            
                //this.grid is the original column numbers selected 
                //document.getElementById("text").innerHTML = this.grid + "XXXXXXXXXXXX " + this.warp;

                this.ctx = canvas.getContext('2d'); //context to draw on 
                this.cells = []; //all cells, 2d array 

                this.init_board(); //generate and render initial board

                window.requestAnimationFrame(() => this.play_game()); //continue playing 
            }

            init_board() {
                /*
                generate and draw cells into 2d array
                NEED TO EDIT THIS TO INCLUDE WARP
                we will no longer have a 1-1 width height grid of cells. instead
                we need to generate only the amount of cells that 
                is defined by the this.grid var 
                --
                so we want there to be this.warp number of cells up and down 
                */
                for(let i = 0; i < this.warp_coords.length; i++) {
                    let cur_row = [];
                    for(let j = 0; j < this.warp_coords.length; j++) {
                        let alive = Math.random();
                        let cell_width = this.warp[j];

                        let cell = new Cell(this.warp_coords[i], this.warp_coords[j], cell_width, alive < 0.5, this.ctx);
                        cur_row.push(cell);
                        cell.draw(); 
                    }
                    this.cells.push(cur_row);
                }
            }

            gen_warp() {
                //create array from 0 to width of canvas 
                //grid is ONE HALF of the width of the board / 10 (cell width min)
                //this is an array from like 0 to 39 (if width is = 800)
                let w = this.width / 2; 
                let grid = Array.from(
                    { length: (w - 1) / 1 + 1 },
                    (value, index) => 0 + index * 1
                    );

                //now we delete random numbers the length of grid is = num_cols
                for(let i=0; i < w - this.num_cols; i++) {
                    //generate random number, remove from grid
                    let r = Math.floor(Math.random() * grid.length);
                    //document.getElementById("text").innerHTML =  grid + " " + r;
                    grid.splice(r, 1);
                }

                //if front and back do not exist, add 
                if (grid.indexOf(0) === -1) {
                    grid.unshift(0);
                }
                if(grid.indexOf(39) === -1) {
                    grid.push(39);
                }
                this.grid = grid; 


                let diff = []
                for(let i=0; i < grid.length - 1; i++) {
                    diff.push(grid[i+1] - grid[i]);
                }

                //all cell spacings for the WHOLE grid, by coord
                //let final = diff.concat(diff.slice().reverse());  
                diff = diff.map(w => w * this.cell_width);
                //last in final multiplied by 2 
                diff[diff.length - 1] *= 2; 
                this.warp_coords = []; 
                let prev = 0;
                //sum all in diff
                diff.forEach((i) => {
                    prev = prev + i; 
                    this.warp_coords.push(prev);
                });
                this.warp_coords.unshift(0);
                this.warp_coords.pop();

                document.getElementById("text").innerHTML = this.warp_coords + "X " + diff;

                return diff; 
            }


            update(cell) {
                /*
                given a cell, count all live neighbors and apply
                game rules accordingly. update the current status
                alive_next
                */

                let live = this.retrieve_neighbors(cell.i, cell.j);

                if (cell.alive) {

                    //fewer than two live neighbours dies: 
                    if (live < 2) {
                        cell.alive_next = false; 
                    }
                    //two or three live neighbors lives: 
                    else if ((live == 2) || (live == 3)) {
                        cell.alive_next = true; 
                    }
                    //more than three live neighbors dies:
                    else {
                        cell.alive_next = false; 
                    }
                }
                else {
                    //cell is currentl dead
                    if (live == 3) {
                        cell.alive_next = true; 
                    }
                }
            }

            retrieve_neighbors(i, j) {
                /*
                ugly af method. I'm sorry 
                gets all neighbors, returns num alive 
                */
                let neighbors = [];
                //document.getElementById("text").innerHTML =  this.width + " " + this.height + " " + i + " " + j;

                //if there are cells to the left..
                if (i > 0) {
                    //get the cell to the left
                    neighbors.push(this.cells[i - 1][j].alive);
                    if (j > 0) {
                        //get the cell to the upper left 
                        neighbors.push(this.cells[i-1][j-1].alive);
                    }
                    if (j < this.height - 1) {
                        //get the cell to the lower left 
                        neighbors.push(this.cells[i-1][j+1].alive)
                    }
                }
                if (i < this.width - 1) {
                    //get the cell to the right...
                    neighbors.push(this.cells[i + 1][j].alive);
                    if (j > 0) {
                        //get cell to upper right...
                        neighbors.push(this.cells[i + 1][j - 1].alive);
                    }
                    if (j < this.height - 1) {
                        neighbors.push(this.cells[i + 1][j + 1].alive);
                    }
                }
                if (j > 0) {
                    //get the cell directl above
                    neighbors.push(this.cells[i][j-1].alive);
                }
                if (j < this.height - 1) {
                    //get the cell directl below 
                    neighbors.push(this.cells[i][j+1].alive);
                }

                return neighbors.filter(Boolean).length;; 
            }

            play_game() {
                /*
                update each cell, render new alive statuses, and 
                then reset past status to current before repeating 
                */

                //update each cell 
                this.cells.forEach(row => {
                    row.forEach(cell => {
                        this.update(cell);
                    });
                });

                //draw each cell with updated status 
                this.cells.forEach(row => {
                    row.forEach(cell => {
                        cell.draw();
                    });
                });

                //set past alive status to current alive_next 
                this.cells.forEach(row => {
                    row.forEach(cell => {
                        cell.alive = cell.alive_next;
                    });
                });

                //wait and repeat 
                setTimeout( () => {
                  window.requestAnimationFrame(() => this.play_game());
                 }, 100)
            }

        }

        let game = new Board('canvas');


        /*
        for warp:
        randoml generate number of sections, from 1 to width/2
        then for this, take an array and select sections
        mirror on other side 

        repeat for height 

        then you will have number of rows and columns. do ever
        ything normally, and then the width height of each cell is 
        the only thing that changes. you'll have to set this up during 
        initialization of the shell 
        */
    </script>
</html>
