<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="style.css">
        <meta charset="UTF-8">
    </head>
    <body>
        <div class="container">
            <canvas id="canvas" width="800" height="800" style="border:1px solid black;">display</canvas>
        </div>
        <p id="text">test</p>

        
    </body>
    <script>
        const CELL_WIDTH = 10; 
    
        class Cell {
            /*
            Instance of one cell 
            */
            constructor(i, j, alive, width, height, ctx) {
                this.i = i; //x coordinate
                this.j = j; //y coordinate
                this.alive = alive; //past status, t/f
                this.alive_next = alive; //future status, t/f
                this.width = width; 
                this.height = height; 
                this.ctx = ctx; //context to draw on 
            }

            draw() {
                if (this.alive_next) { //if alive in current frame, render color
                    this.ctx.fillStyle = 'white';
                    this.ctx.fillRect(this.i * CELL_WIDTH, this.j  * CELL_WIDTH, this.width * CELL_WIDTH, this.height * CELL_WIDTH);
                }
                else { //if dead, render other color 
                    this.ctx.fillStyle = 'black';
                    this.ctx.fillRect(this.i * CELL_WIDTH, this.j  * CELL_WIDTH, this.width * CELL_WIDTH, this.height * CELL_WIDTH);
                }
            }
        }
    
        class Board {
            /*
            Instance of game board, contains w/h and cells 
            */
            constructor(id) {
                this.canvas = document.getElementById(id); //canvas to draw on
                this.cell_width = CELL_WIDTH; //width of cell 
                this.width = this.canvas.width / this.cell_width; //num cells x direction
                this.height = this.canvas.height / this.cell_width; //num cells y direction

                this.warp_coords = this.gen_warp(); 
                this.warp_size = this.calculate_warp_size(); 

                this.ctx = canvas.getContext('2d'); //context to draw on 
                this.cells = []; //all cells, 2d array 

                this.init_board(); //generate and render initial board
                window.requestAnimationFrame(() => this.play_game()); //continue playing 
            }

            init_board() {
                /*
                generate and draw cells into 2d array
                must be one quarter of the board (!) 
                */
                //for warp_coords (columns)
                let top_rows = []; 
                let bot_rows = []; 
                for(let j = 0; j < this.warp_coords.length; j++) {
                    let tr_row = [];
                    let tl_row = [];
                    let br_row = [];
                    let bl_row = [];

                    let ch = this.warp_size[j];
                    //for warp_coords (rows)
                    for(let i = 0; i < this.warp_coords.length; i++) {
                        let cw = this.warp_size[i];
                        //randomly assign cell as alive
                        let alive = Math.random();
                        let tr_cell = new Cell(this.warp_coords[i], this.warp_coords[j], alive < 0.5, cw, ch, this.ctx);
                        let tl_cell = new Cell(this.width - this.warp_coords[i] - cw, this.warp_coords[j], alive < 0.5, cw, ch, this.ctx);
                        let br_cell = new Cell(this.warp_coords[i], this.height - this.warp_coords[j] - ch, alive < 0.5, cw, ch, this.ctx);
                        let bl_cell = new Cell(this.width - this.warp_coords[i] - cw, this.height - this.warp_coords[j] - ch, alive < 0.5, cw, ch, this.ctx);

                        tr_row.push(tr_cell);                       
                        tl_row.unshift(tl_cell);   
                        br_row.push(br_cell);                       
                        bl_row.unshift(bl_cell);   

                        tr_cell.draw(); 
                        tl_cell.draw(); 
                        br_cell.draw(); 
                        bl_cell.draw(); 

                    }
                    //combine top and bottom rows: 
                    top_rows.push(tr_row.concat(tl_row));
                    bot_rows.unshift(br_row.concat(bl_row));
                    document.getElementById("text").innerHTML =  this.warp_coords.length + "C" + bot_rows[0] + "X " + bot_rows.length; 

                    //this.cells.push(tr_row.push.apply(tr_row, tl_row));
                }
                this.cells.push(top_rows.concat(bot_rows));
                this.cells = this.cells[0];
            }

            gen_warp() {
                /* generate warp_coords, an array of coordinates 
                for the top right quarter of the board. the array will be
                be 1/2 of the board width. then a random number of elements 
                will be removed  */

                let w = this.width / 2; 
                let num_sections = Math.floor(Math.random() * ((this.width / 2) - 1) + 1);

                let grid = Array.from(
                    { length: (w - 1) / 1 + 1 },
                    (value, index) => 0 + index * 1
                );

                for(let i=0; i < w - num_sections; i++) {
                    //generate random number, remove from grid
                    let r = Math.floor(Math.random() * grid.length);
                    grid.splice(r, 1);
                }

                if (grid.indexOf(0) === -1) {
                    grid.unshift(0);
                }

                return grid; 
            }

            calculate_warp_size() {
                let grid = this.warp_coords; 
                grid.push(this.width / 2);

                let diff = []

                for(let i=0; i < grid.length - 1; i++) {
                    diff.push(grid[i+1] - grid[i]);
                }

                return diff; 

            }

            update(cell) {
                /*
                given a cell, count all live neighbors and apply
                game rules accordingly. update the current status
                alive_next
                */
                let live = this.retrieve_neighbors(cell.i, cell.j);
                document.getElementById("text").innerHTML = this.width + "Y" + this.warp_coords.length + " x "+ cell.i + "updated" + cell.j;                       

                if (cell.alive) {
                    //fewer than two live neighbours dies: 
                    if (live < 2) {
                        cell.alive_next = false; 
                    }
                    //two or three live neighbors lives: 
                    else if ((live == 2) || (live == 3)) {
                        cell.alive_next = true; 
                    }
                    //more than three live neighbors dies:
                    else {
                        cell.alive_next = false; 
                    }
                }
                else {
                    //cell is currentl dead
                    if (live == 3) {
                        cell.alive_next = true; 
                    }
                }
            }

            retrieve_neighbors(i, j) {
                /*
                ugly af method. I'm sorry 
                gets all neighbors, returns num alive 
                */
                let neighbors = [];
                //document.getElementById("text").innerHTML =  this.width + " " + this.height + " " + i + " " + j;

                //if there are cells to the left..
                if (i > 0) {
                    //get the cell to the left
                    neighbors.push(this.cells[i - 1][j].alive);
                    if (j > 0) {
                        //get the cell to the upper left 
                        neighbors.push(this.cells[i-1][j-1].alive);
                    }
                    if (j < this.height - 1) {
                        //get the cell to the lower left 
                        neighbors.push(this.cells[i-1][j+1].alive)
                    }
                }

                if (i < this.width - 1) {
                    //get the cell to the right...
                    neighbors.push(this.cells[i + 1][j].alive);
                    if (j > 0) {
                        //get cell to upper right...
                        neighbors.push(this.cells[i + 1][j - 1].alive);
                    }
                    if (j < this.height - 1) {
                        neighbors.push(this.cells[i + 1][j + 1].alive);
                    }
                }
                document.getElementById("text").innerHTML = "CRASH";                       

                if (j > 0) {
                    //get the cell directl above
                    neighbors.push(this.cells[i][j-1].alive);
                }
                if (j < this.height - 1) {
                    //get the cell directl below 
                    neighbors.push(this.cells[i][j+1].alive);
                }

                return neighbors.filter(Boolean).length;; 
            }

            play_game() {
                /*
                update each cell, render new alive statuses, and 
                then reset past status to current before repeating 
                */
                //update each cell 

                this.cells.forEach(row => {
                    row.forEach(cell => {
                        this.update(cell);
                    });
                });

                //draw each cell with updated status 
                this.cells.forEach(row => {
                    //document.getElementById("text").innerHTML =  "s lol"; 
                    row.forEach(cell => {
                        cell.draw(); 
                    });
                });

                //set past alive status to current alive_next 
                this.cells.forEach(row => {
                    row.forEach(cell => {
                        cell.alive = cell.alive_next;
                    });
                });

                //wait and repeat 
                setTimeout( () => {
                  window.requestAnimationFrame(() => this.play_game());
                 }, 100)
            }

        }

        let game = new Board('canvas');
    </script>
</html>
